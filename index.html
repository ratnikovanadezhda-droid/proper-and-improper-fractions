<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173750"><title>Дроби · тренажёр Гоши</title><style>
:root{--ink:#173750;--muted:#63798a;--line:#d9e4eb;--bg:#f3f7f9;--blue:#367ca0;--mint:#e5f3ed;--green:#32785c;--wrong:#c35c57;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1000px;margin:0 auto;padding:27px 18px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-size:13px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}h1{font-size:clamp(26px,4.5vw,40px);line-height:1.18;margin:4px 0 6px;font-weight:780}header p{margin:0;color:var(--muted)}.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}.tab{border:1.5px solid var(--line);background:white;border-radius:14px;text-align:left;padding:15px;min-height:92px;transition:.15s}.tab strong{display:block;font-size:16px}.tab span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.tab.active{border-color:var(--blue);background:#e9f4fa;box-shadow:0 0 0 2px #c3e2f0 inset}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:clamp(18px,3.5vw,30px);box-shadow:0 12px 35px #14334a0b}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{font-size:13px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--blue)}.status{font-size:14px;color:var(--muted)}.bar{height:7px;background:#e9eff2;border-radius:20px;overflow:hidden;margin:12px 0 25px}.bar>div{height:100%;background:#69aa90;transition:width .25s}.instruction{font-size:clamp(17px,2vw,21px);font-weight:620;color:#3d5c70;margin:0 0 12px}.mathprompt{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:11px;min-height:100px;margin:12px 0 20px;font-weight:690;font-size:clamp(33px,6vw,55px);letter-spacing:.01em}.frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;line-height:1.07;font-size:.85em;min-width:1.2em;white-space:nowrap}.frac>.num{border-bottom:2px solid currentColor;padding:0 .15em .09em;min-width:100%;text-align:center}.frac>.den{padding:.09em .15em 0;text-align:center}.mixed{display:inline-flex;align-items:center;gap:.13em}.part{font-size:.66em;color:var(--muted)}.visual{border:1px solid #e4eef2;border-radius:12px;background:#fbfdfe;padding:15px;min-height:97px;margin-bottom:20px}.vtitle{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:9px}.visrows{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.visunit{display:flex;gap:2px;width:min(164px,100%);height:36px;border:1.5px solid #9bb8c7;border-radius:6px;overflow:hidden;background:#f1f6f8}.piece{flex:1;background:#d9e6ed;border-right:1px solid white}.piece:last-child{border-right:0}.piece.filled{background:#8ac2a9}.visual-note{text-align:center;font-size:13px;color:var(--muted);margin-top:7px}.sectionlabel{font-size:14px;font-weight:720;margin-bottom:11px}.steps{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 18px}.step{width:28px;height:5px;border-radius:5px;background:#dce7eb}.step.done{background:#79b69b}.step.active{background:var(--blue)}.inputrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;min-height:76px}.answer-input{width:110px;height:62px;border:2px solid #b7cdd9;border-radius:13px;text-align:center;font-size:32px;font-weight:650;outline:none;color:var(--ink);background:#fff}.answer-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #e7f3f9}.answer-input.error{border-color:var(--wrong);animation:shake .32s}.button{border:0;border-radius:12px;padding:16px 24px;background:var(--ink);color:white;font-weight:700;min-height:54px}.button:hover{background:#24516e}.button.secondary{background:#eff4f6;color:var(--ink)}.button:disabled{opacity:.45;cursor:not-allowed}.feedback{text-align:center;min-height:30px;font-weight:600;margin-top:10px;color:var(--muted)}.feedback.bad{color:var(--wrong)}.feedback.good{color:var(--green)}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:17px}.hint{border:none;background:transparent;color:var(--blue);font-size:14px;font-weight:650;padding:6px}.hintpanel{background:#f1f7fa;border-radius:10px;padding:11px 14px;margin:8px 0;color:#365b70;font-size:14px}.completed{text-align:center;background:var(--mint);padding:25px 16px;border-radius:13px;margin:8px 0 17px}.completed h2{font-size:25px;margin:0 0 8px}.completed p{margin:0;color:#42685c}.stats{font-size:13px;color:var(--muted)}.pill{display:inline-flex;border:1px solid var(--line);border-radius:30px;padding:8px 12px;color:var(--muted);font-size:13px;background:white}.smallbtn{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:9px 12px}#working{color:#456d83;font-size:19px;text-align:center;min-height:30px}#working .frac{font-size:1em}.subrow{display:flex;gap:5px;justify-content:center;align-items:center;flex-wrap:wrap}.skip-help{margin:16px 0 0;color:#738b98;font-size:13px;text-align:center}.under{border-bottom:1.5px solid currentColor}.chip{display:inline-block;padding:4px 10px;background:#edf4f7;border-radius:8px;margin:0 4px}.success-mark{color:var(--green);font-size:36px}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}@media(max-width:650px){.wrap{padding:18px 12px 42px}.levels{gap:6px}.tab{padding:10px;min-height:100px}.tab strong{font-size:14px}.tab span{font-size:12px}.inputrow{flex-direction:column}.answer-input{width:130px}.button{width:100%}.footer .button{width:auto}.visunit{width:114px;height:31px}.mathprompt{gap:8px}header{align-items:flex-start}}
</style></head><body><main class="wrap"><header><div><div class="brand">Математика · Гоша</div><h1>Дроби. Шаг за шагом</h1><p>От целых долей к смешанным числам</p></div><div class="pill" id="globalScore">Решено: 0</div></header><nav class="levels" aria-label="Уровни сложности"><button class="tab active" data-level="1"><strong>01 · Целые и доли</strong><span>6/2 → 3; 2 → ?/3</span></button><button class="tab" data-level="2"><strong>02 · Действия</strong><span>Сложение и вычитание</span></button><button class="tab" data-level="3"><strong>03 · Перевод</strong><span>Смешанные ↔ неправильные</span></button></nav><section class="card"><div class="topline"><div class="eyebrow" id="levelTitle">Уровень 1</div><div class="status" id="progressLabel">Задание 1 из 10</div></div><div class="bar"><div id="progressBar" style="width:0%"></div></div><div id="work"><p class="instruction" id="instruction"></p><div class="mathprompt" id="problem"></div><div class="visual" id="visual"></div><div class="steps" id="steps"></div><div class="sectionlabel" style="text-align:center" id="actionLabel"></div><div id="working"></div><form class="inputrow" id="form" autocomplete="off"><input class="answer-input" id="answer" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Ответ"><button class="button" id="check" type="submit">Проверить</button></form><div class="feedback" id="feedback" aria-live="polite"></div><div id="hintpanel" class="hintpanel" hidden></div><div class="footer"><button type="button" class="hint" id="hint">Показать подсказку</button><span class="stats" id="stats">Без спешки. Один шаг за раз.</span></div></div><div id="finish" hidden></div></section><p class="skip-help">При ошибке шаг не меняется. После правильного ответа переход происходит автоматически.</p></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id), rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)], frac=(a,b)=>`<span class="frac"><span class="num">${a}</span><span class="den">${b}</span></span>`,mixed=(w,a,d)=>`<span class="mixed">${w}${frac(a,d)}</span>`;
const levelNames={1:'Целые и доли',2:'Сложение и вычитание',3:'Смешанные и неправильные'};
let level=1, task=null, index=0, stage=0, tries=0, totalWrong=0, wrongThis=0, done=0, solvedAll=0, hintOpen=false, completed=false; const TASKS=10;
const used=new Set();
function generate(L){let t,d,a,b,w,n;for(let attempt=0;attempt<80;attempt++){if(L===1){d=pick([2,3,4,5,6,7,8,9]);w=rand(1,4);if(Math.random()<.5){t={kind:'fractionWhole',den:d,whole:w,n:d*w};}else{t={kind:'wholeFraction',den:d,whole:w,n:d*w};}}
if(L===2){d=rand(2,10);a=rand(1,Math.min(d+2,9));if(Math.random()<.5){b=rand(1,Math.min(d+2,9));t={kind:'add',den:d,a,b,answer:a+b};}else{b=rand(1,Math.min(a,9));t={kind:'sub',den:d,a,b,answer:a-b};}}
if(L===3){d=rand(2,9);w=rand(1,4);a=rand(1,d-1);n=w*d+a;t=Math.random()<.5?{kind:'mixToImproper',den:d,whole:w,a,n}:{kind:'improperToMix',den:d,whole:w,a,n};}
const key=JSON.stringify(t);if(!used.has(key)){used.add(key);return t;}}return t;}
function stages(t){if(t.kind==='wholeFraction')return[{label:'Сколько долей всего?',value:t.n,hint:`В каждом целом ${t.den} долей. Посчитай все доли в ${t.whole} целых.`}];if(t.kind==='fractionWhole')return[{label:'Сколько целых получится?',value:t.whole,hint:`В одном целом ${t.den} долей. Сколько полных групп по ${t.den} долей?`}];if(t.kind==='add'||t.kind==='sub')return[{label:'Числитель ответа',value:t.answer,hint:`Знаменатель остаётся ${t.den}. ${t.kind==='add'?'Сложи':'Вычти'} только числители.`}];if(t.kind==='mixToImproper')return[{label:'Сколько долей в целых?',value:t.whole*t.den,hint:`Посчитай по ${t.den} долей в каждом из ${t.whole} целых.`},{label:'Добавь оставшиеся доли',value:t.n,hint:`К числу долей из целых добавь ещё ${t.a}.`},{label:'Числитель неправильной дроби',value:t.n,hint:`Запиши все подсчитанные доли над знаменателем ${t.den}.`}];return[{label:'Сколько полных целых?',value:t.whole,hint:`Раздели ${t.n} на ${t.den} с остатком. Сколько полных групп получится?`},{label:'Сколько долей осталось?',value:t.a,hint:`Из ${t.n} долей вычти ${t.whole} полных групп по ${t.den}.`},{label:'Числитель дробной части',value:t.a,hint:`Остаток запиши над знаменателем ${t.den}.`}];}
function problem(t){switch(t.kind){case'wholeFraction':return `${t.whole} = ${frac('?',t.den)}`;case'fractionWhole':return `${frac(t.n,t.den)} = ?`;case'add':return `${frac(t.a,t.den)} + ${frac(t.b,t.den)} = ${frac('?',t.den)}`;case'sub':return `${frac(t.a,t.den)} − ${frac(t.b,t.den)} = ${frac('?',t.den)}`;case'mixToImproper':return `${mixed(t.whole,t.a,t.den)} = ${frac('?',t.den)}`;default:return `${frac(t.n,t.den)} = <span class="part">? целых и ? долей</span>`;}}
function visual(t){const chunks=(total,d)=>{let s='';for(let j=0;j<total;j+=d){const k=Math.min(total-j,d);s+='<div class="visunit">'+Array.from({length:d},(_,i)=>`<span class="piece ${i<k?'filled':''}"></span>`).join('')+'</div>';}return s;};let title='Посмотри на равные доли', content='', note='';if(t.kind==='wholeFraction'||t.kind==='fractionWhole'){content=chunks(t.n,t.den);note=`Каждая полоска — ${t.den} долей. Всего ${t.n} долей.`;if(t.kind==='wholeFraction')note='Считай доли в целых полосках.';else note='Собери полные полоски из долей.';}else if(t.kind==='mixToImproper'){content=chunks(t.n,t.den);note='Полные полоски и ещё часть одной полоски.';}else if(t.kind==='improperToMix'){content=chunks(t.n,t.den);note=`Каждая полная полоска содержит ${t.den} долей.`;}else{const vis=(n)=>'<div class="visrows">'+chunks(n,t.den)+'</div>';content=`<div style="display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap"><div>${vis(t.a)}</div><strong>${t.kind==='add'?'+':'−'}</strong><div>${vis(t.b)}</div></div>`;note='Все полоски разделены на одинаковые доли.';}return `<div class="vtitle">${title}</div><div class="visrows">${content}</div><div class="visual-note">${note}</div>`;}
function instruction(t){switch(t.kind){case'wholeFraction':return 'Запиши целое число в виде дроби.';case'fractionWhole':return 'Сколько целых получится из этих долей?';case'add':return 'Сложи дроби с одинаковыми знаменателями.';case'sub':return 'Вычти дроби с одинаковыми знаменателями.';case'mixToImproper':return 'Преврати смешанное число в неправильную дробь.';default:return 'Выдели целую часть из неправильной дроби.';}}
function working(t,s){if(t.kind==='mixToImproper'){if(s===0)return `${t.whole} целых = ${frac('?',t.den)}`;if(s===1)return `${frac(t.whole*t.den,t.den)} + ${frac(t.a,t.den)} = ${frac('?',t.den)}`;return `${mixed(t.whole,t.a,t.den)} = ${frac('?',t.den)}`;}if(t.kind==='improperToMix'){if(s===0)return `${t.n} : ${t.den} = ? (целых)`;if(s===1)return `${t.n} − ${t.whole} × ${t.den} = ?`;return `${frac(t.n,t.den)} = ${mixed(t.whole,'?',t.den)}`;}return '';}
function setFeedback(text,cls=''){const e=$('feedback');e.textContent=text;e.className='feedback '+cls;}
function showTask(){completed=false;task=generate(level);stage=0;tries=0;wrongThis=0;hintOpen=false;$('finish').hidden=true;$('work').hidden=false;$('progressLabel').textContent=`Задание ${index+1} из ${TASKS}`;$('progressBar').style.width=(index/TASKS*100)+'%';$('instruction').textContent=instruction(task);$('problem').innerHTML=problem(task);$('visual').innerHTML=visual(task);renderStage();}
function renderStage(){const ss=stages(task),s=ss[stage];$('actionLabel').textContent=s.label;$('working').innerHTML=working(task,stage);$('steps').innerHTML=ss.length===1?'':ss.map((_,i)=>`<span class="step ${i<stage?'done':i===stage?'active':''}"></span>`).join('');$('hintpanel').textContent=s.hint;$('hintpanel').hidden=true;$('hint').textContent='Показать подсказку';hintOpen=false;$('answer').disabled=false;$('check').disabled=false;$('answer').value='';$('answer').classList.remove('error');setFeedback('');$('stats').textContent=`Ошибок в этом задании: ${wrongThis}`;$('answer').focus();}
function submit(event){event.preventDefault();if(completed||!task)return;const v=$('answer').value.trim();if(!/^\d+$/.test(v)){setFeedback('Введи целое число.','bad');bad();return;}if(Number(v)!==stages(task)[stage].value){wrongThis++;totalWrong++;tries++;bad();setFeedback(tries>=2?'Пока неверно. Посмотри на полоски или открой подсказку.':'Не совпало. Попробуй ещё раз.','bad');$('stats').textContent=`Ошибок в этом задании: ${wrongThis}`;return;}
tries=0;setFeedback('Верно!','good');$('answer').disabled=true;$('check').disabled=true;setTimeout(()=>{stage++;if(stage<stages(task).length)renderStage();else taskDone();},450);}
function bad(){const e=$('answer');e.classList.remove('error');void e.offsetWidth;e.classList.add('error');e.select();}
function result(t){if(t.kind==='wholeFraction')return `${t.whole} = ${frac(t.n,t.den)}`;if(t.kind==='fractionWhole')return `${frac(t.n,t.den)} = ${t.whole}`;if(t.kind==='add'||t.kind==='sub')return `${frac(t.a,t.den)} ${t.kind==='add'?'+':'−'} ${frac(t.b,t.den)} = ${frac(t.answer,t.den)}`;if(t.kind==='mixToImproper')return `${mixed(t.whole,t.a,t.den)} = ${frac(t.n,t.den)}`;return `${frac(t.n,t.den)} = ${mixed(t.whole,t.a,t.den)}`;}
function taskDone(){done++;solvedAll++;$('globalScore').textContent=`Решено: ${solvedAll}`;$('progressBar').style.width=(done/TASKS*100)+'%';$('work').hidden=true;$('finish').hidden=false;if(done>=TASKS){completed=true;$('progressLabel').textContent='Уровень пройден';$('finish').innerHTML=`<div class="completed"><div class="success-mark">✓</div><h2>Уровень пройден</h2><p>10 заданий решены. Ошибок за уровень: ${totalWrong}.</p></div><div class="footer"><button class="button secondary" id="again">Ещё 10 заданий</button><button class="button" id="next">${level<3?'Следующий уровень':'Начать с первого уровня'}</button></div>`;$('again').onclick=()=>setLevel(level);$('next').onclick=()=>setLevel(level<3?level+1:1);}else{$('finish').innerHTML=`<div class="completed"><div class="success-mark">✓</div><h2>Получилось!</h2><div class="mathprompt" style="min-height:62px;font-size:clamp(26px,4vw,38px);margin:7px 0">${result(task)}</div></div><button class="button" id="continue" style="display:block;margin:auto">Следующее задание →</button>`;$('continue').onclick=()=>{index=done;showTask();};}}
function setLevel(L){level=L;index=0;done=0;totalWrong=0;used.clear();document.querySelectorAll('[data-level]').forEach(e=>{e.classList.toggle('active',Number(e.dataset.level)===L);e.setAttribute('aria-current',Number(e.dataset.level)===L?'step':'false');});$('levelTitle').textContent=`Уровень ${L} · ${levelNames[L]}`;showTask();}
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>setLevel(Number(b.dataset.level))));$('form').addEventListener('submit',submit);$('hint').addEventListener('click',()=>{$('hintpanel').hidden=!$('hintpanel').hidden;$('hint').textContent=$('hintpanel').hidden?'Показать подсказку':'Скрыть подсказку';});setLevel(1);
})();
</script></body></html>
